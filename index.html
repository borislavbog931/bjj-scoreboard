<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BJJ Score">
<meta name="theme-color" content="#1c1d22">
<title>BJJ Scoreboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Antonio, self-hosted (SIL OFL, see fonts/OFL.txt) */
@font-face{font-family:"Antonio";font-style:normal;font-weight:100 700;font-display:swap;
  src:url(fonts/antonio-latin-ext-wght-normal.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Antonio";font-style:normal;font-weight:100 700;font-display:swap;
  src:url(fonts/antonio-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  color-scheme:dark;
  --bg:#25272e; --bg-deep:#1c1d22; --panel:#000; --line:#1b1c21;
  --text:#fff; --muted:#9b9ca2; --digit:#a6a7ab;
  --plus:#a9e2a2; --minus:#cf8f8f;
  --gold:#a9962f; --gold-hot:#d8bf3a; --gold-ink:#571313; --round:#c9a93a;
  --s1-bg:#f5dd4f; --s1-ink:#3d8a5c; --s2-bg:#000; --s2-ink:#fff;
  --alert:#d8352b; --adv:#5fd36a; --pen:#ee4438;
  --font:"Antonio","Oswald","Bebas Neue",Impact,"Arial Narrow",sans-serif;
}
/* The scoreboard is deliberately dark in both viewer themes (gym lighting, glanceability). */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#25272e; } }
:root[data-theme="dark"]{ --bg:#25272e; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font);font-weight:500;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:2px solid var(--gold-hot);outline-offset:-2px}

/* ---------- stage: always landscape (rotated by JS when the phone is upright) ---------- */
#app{position:fixed;top:0;left:0;transform-origin:0 0;container-type:size;overflow:hidden;
  background:var(--bg);display:grid;grid-template-rows:37% 37% 26%;
  padding-left:env(safe-area-inset-left);user-select:none;-webkit-user-select:none;text-transform:uppercase}

.fighter{display:grid;grid-template-columns:minmax(0,1fr) 12cqw 8cqw 20cqw;column-gap:1.2cqw;min-height:0;overflow:hidden}
.fighter + .fighter{border-top:.5cqh solid var(--line)}
.f-main{display:grid;grid-template-rows:32% minmax(0,1fr);padding:1.6cqh 0 1.8cqh 1.5cqw;min-width:0;min-height:0}
.f-head{display:flex;align-items:center;gap:1cqw;min-width:0;white-space:nowrap}
.flag{font-size:min(8cqh,4cqw);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.flag:empty{display:none}
.name{font-size:min(9.2cqh,4.6cqw);font-weight:600;line-height:1;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.meta{font-size:min(5.2cqh,2.5cqw);color:var(--muted);line-height:1;overflow:hidden;text-overflow:ellipsis;flex:1 3 0;min-width:0;padding-top:1.6cqh}
.meta b{font-weight:500;margin-right:.6cqw}

.pad{background:var(--panel);border-radius:1.6cqh;display:grid;
  grid-template-columns:repeat(6,1fr) 1.7fr;grid-template-rows:1fr 1fr;min-height:0}
.pad button{font-size:min(6.6cqh,3.2cqw);line-height:1;border-radius:1.6cqh;white-space:nowrap}
.pad .p{color:var(--plus)} .pad .m{color:var(--minus)}
.pad .stall-btn{grid-column:7;grid-row:1 / span 2;color:var(--text);font-size:min(5.4cqh,2.5cqw);letter-spacing:.02em}
.pad button:active,.bar-btns button:active,.clock-ctl button:active,#dbl:active{background:#2b2d35}
.pad .stall-btn.on{color:var(--gold-hot)}

.stall{margin:1.8cqh 0;border-radius:1.8cqh;background:var(--gold);color:var(--gold-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqh;min-height:0}
.stall .t{font-size:min(11.5cqh,5.2cqw);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stall .l{font-size:min(4.6cqh,2.1cqw);line-height:1}
.stall.run{background:var(--gold-hot)}
.stall.hold{opacity:.6}
.stall.exp{background:var(--alert);color:#fff;animation:blink .5s steps(2,start) infinite}

.ap{display:grid;grid-template-rows:1fr 1fr;text-align:center;min-height:0;padding:1cqh 0}
.ap div{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.ap span{font-size:min(3.3cqh,1.5cqw);color:var(--muted);line-height:1.1}
.ap output{font-size:min(11.5cqh,6cqw);font-weight:600;color:var(--digit);line-height:1;font-variant-numeric:tabular-nums}
.ap output.adv{color:var(--adv)}
.ap output.pen{color:var(--pen)}
.name{cursor:pointer}
.name:active{opacity:.6}

.score{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.score output{font-size:min(28cqh,13cqw);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fighter[data-i="0"] .score{background:var(--s1-bg);color:var(--s1-ink)}
.fighter[data-i="1"] .score{background:var(--s2-bg);color:var(--s2-ink)}
.score.bump output{animation:bump .25s ease-out}

#dbl{position:absolute;right:2.2cqw;width:15.6cqw;top:37cqh;transform:translateY(-50%);z-index:2;
  background:#000;color:#fff;border-radius:1.4cqh;padding:1.5cqh 0;font-size:min(4.3cqh,2cqw);line-height:1;letter-spacing:.02em}

/* ---------- bottom bar ---------- */
.bar{display:grid;grid-template-columns:minmax(0,1fr) 30cqw;column-gap:1.5cqw;padding:1.5cqh 1.2cqw 1.5cqh 1.5cqw;
  background:var(--bg-deep);min-height:0}
.bar-left{display:grid;grid-template-rows:1fr 1fr;row-gap:1.2cqh;min-height:0;min-width:0}
.match{display:flex;align-items:center;gap:1.4cqw;min-width:0}
.mid{background:#fff;color:#000;border-radius:1.2cqh;font-size:min(8cqh,4cqw);font-weight:700;line-height:1;
  padding:1.2cqh 1.3cqw;white-space:nowrap;align-self:stretch;display:flex;align-items:center}
.mid:empty{display:none}
.mtxt{min-width:0;line-height:1.12}
.mtxt .cat{font-size:min(4.5cqh,2.2cqw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtxt .rnd{font-size:min(4.1cqh,2cqw);color:var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-btns{background:var(--panel);border-radius:1.4cqh;display:grid;grid-template-columns:repeat(6,1fr);min-height:0}
.bar-btns button{font-size:min(3.9cqh,1.85cqw);line-height:1;border-radius:1.4cqh;white-space:nowrap;letter-spacing:.02em}
.bar-btns button.armed{background:var(--alert)}

.clock{background:#2a2b31;border-radius:1.8cqh;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) 9cqh;min-height:0}
.clock-t{font-size:min(14cqh,7.4cqw);font-weight:700;line-height:1;color:#77787c;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;width:100%;letter-spacing:.01em}
.clock.run .clock-t{color:#fff}
.clock.low .clock-t{color:var(--gold-hot)}
.clock.done .clock-t{color:var(--alert);animation:blink .6s steps(2,start) infinite}
.clock-ctl{background:var(--panel);display:grid;grid-template-columns:repeat(5,1fr)}
.clock-ctl button{font-size:min(4.4cqh,2.1cqw);line-height:1;display:flex;align-items:center;justify-content:center}
.clock-ctl svg{height:5.4cqh;width:5.4cqh;fill:#fff}

@keyframes blink{to{opacity:.35}}
@keyframes bump{from{transform:scale(1.18)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stall.exp,.clock.done .clock-t,.score.bump output{animation:none}}

/* ---------- toast + result (inside the rotated stage) ---------- */
#toast{position:absolute;left:50%;top:2cqh;transform:translateX(-50%);background:#000;color:#fff;border:1px solid #3a3c45;
  border-radius:1.4cqh;padding:1.6cqh 2cqw;font-size:min(4.4cqh,2.2cqw);line-height:1;z-index:5;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
#result{position:absolute;inset:0;z-index:6;background:rgba(10,10,13,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:2.4cqh;text-align:center;padding:3cqh 3cqw}
#result.open{display:flex}
#result .k{font-size:min(5cqh,2.4cqw);color:var(--round);line-height:1}
#result .w{font-size:min(17cqh,8cqw);font-weight:700;line-height:1;max-width:94cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#result .how{font-size:min(5.6cqh,2.7cqw);color:var(--muted);line-height:1}
#result .rows{display:grid;grid-template-columns:auto 1fr 1fr;gap:1.4cqh 1cqw;align-items:center;margin-top:1.5cqh;width:min(78cqw,100%)}
#result .rows span{font-size:min(4cqh,1.9cqw);color:var(--muted);text-align:right;padding-right:.6cqw}
#result button{background:#000;border:1px solid #3a3c45;border-radius:1.4cqh;padding:2.2cqh 1.6cqw;font-size:min(4.4cqh,2.1cqw);line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#result button:active{background:#2b2d35}
#result .end{display:flex;gap:1.2cqw;margin-top:1cqh}
#result .end .go{background:var(--gold);color:#000;border-color:var(--gold)}

/* ---------- setup sheet (not rotated, so the keyboard behaves) ---------- */
#setup{position:fixed;inset:0;z-index:20;background:rgba(10,10,13,.96);overflow:auto;display:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400;text-transform:none;
  padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
#setup.open{display:block}
#setup form{max-width:760px;margin:0 auto}
#setup h1{font-family:var(--font);font-weight:600;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:14px}
#setup h2{font-family:var(--font);font-weight:500;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--round);margin:18px 0 8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input[type=text],.fld input[type=number]{width:100%;font:inherit;font-size:16px;color:#fff;background:#14151a;border:1px solid #3a3c45;
  border-radius:8px;padding:10px 12px}
.fld input:focus{outline:2px solid var(--gold-hot);outline-offset:0;border-color:transparent}
.row3{display:grid;grid-template-columns:96px 1fr;gap:10px}
.time{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.chips button{font-family:system-ui,sans-serif;font-size:14px;background:#14151a;border:1px solid #3a3c45;border-radius:999px;padding:8px 14px}
.chips button:active{background:#2b2d35}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin:10px 0}
.chk input{width:22px;height:22px;accent-color:var(--gold-hot)}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;font-family:var(--font);font-size:18px;letter-spacing:.03em;text-transform:uppercase;padding:14px;border-radius:10px;border:1px solid #3a3c45;background:#14151a}
.acts .go{background:var(--gold-hot);border-color:var(--gold-hot);color:#000;font-weight:600}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:6px}
</style>
</head>
<body>

<div id="app">
  <!-- fighters rendered by JS -->
  <section class="fighter" data-i="0"></section>
  <section class="fighter" data-i="1"></section>
  <button id="dbl" data-act="double">Double stalling</button>

  <footer class="bar">
    <div class="bar-left">
      <div class="match">
        <div class="mid" id="mid"></div>
        <div class="mtxt"><div class="cat" id="cat"></div><div class="rnd" id="rnd"></div></div>
      </div>
      <div class="bar-btns">
        <button data-act="undo">Undo score</button>
        <button data-act="switch">Switch sides</button>
        <button data-act="reset" id="resetBtn">Reset match</button>
        <button data-act="end">End match</button>
        <button data-act="setup">Setup</button>
        <button data-act="full">Full screen</button>
      </div>
    </div>
    <div class="clock" id="clock">
      <button class="clock-t" id="clockT" data-act="toggle" aria-label="Start or pause the match clock">05:00</button>
      <div class="clock-ctl">
        <button data-act="adj" data-d="-30" aria-label="Minus 30 seconds">&minus;30</button>
        <button data-act="adj" data-d="-1" aria-label="Minus 1 second">&minus;1</button>
        <button data-act="toggle" id="playBtn" aria-label="Start or pause"></button>
        <button data-act="adj" data-d="1" aria-label="Plus 1 second">+1</button>
        <button data-act="adj" data-d="30" aria-label="Plus 30 seconds">+30</button>
      </div>
    </div>
  </footer>

  <div id="toast" role="status"></div>

  <div id="result">
    <div class="k" id="resK">Winner</div>
    <div class="w" id="resW"></div>
    <div class="how" id="resHow"></div>
    <div class="rows">
      <span>Submission by</span><button data-act="sub" data-i="0" id="sub0"></button><button data-act="sub" data-i="1" id="sub1"></button>
      <span>Disqualify</span><button data-act="dq" data-i="0" id="dq0"></button><button data-act="dq" data-i="1" id="dq1"></button>
    </div>
    <div class="end">
      <button data-act="resClose">Back to match</button>
      <button class="go" data-act="newMatch">New match</button>
    </div>
  </div>
</div>

<div id="setup">
  <form id="setupForm" autocomplete="off">
    <h1>Match setup</h1>
    <div class="cols">
      <div>
        <h2>Top fighter</h2>
        <label class="fld"><span>Name</span><input type="text" id="n0" maxlength="40"></label>
        <div class="row3">
          <label class="fld"><span>Country</span><input type="text" id="c0" maxlength="3" placeholder="BRA"></label>
          <label class="fld"><span>Team</span><input type="text" id="t0" maxlength="40"></label>
        </div>
      </div>
      <div>
        <h2>Bottom fighter</h2>
        <label class="fld"><span>Name</span><input type="text" id="n1" maxlength="40"></label>
        <div class="row3">
          <label class="fld"><span>Country</span><input type="text" id="c1" maxlength="3" placeholder="UAE"></label>
          <label class="fld"><span>Team</span><input type="text" id="t1" maxlength="40"></label>
        </div>
      </div>
    </div>

    <h2>Match</h2>
    <div class="row3">
      <label class="fld"><span>Mat / fight no.</span><input type="text" id="fMid" maxlength="8" placeholder="A-21"></label>
      <label class="fld"><span>Division</span><input type="text" id="fCat" maxlength="70" placeholder="Men / Black / Adult / -94 kg"></label>
    </div>
    <label class="fld"><span>Round</span><input type="text" id="fRnd" maxlength="40" placeholder="Final"></label>

    <h2>Clock</h2>
    <div class="chips" id="chips">
      <button type="button" data-min="4">4 min</button><button type="button" data-min="5">5 min</button>
      <button type="button" data-min="6">6 min</button><button type="button" data-min="7">7 min</button>
      <button type="button" data-min="8">8 min</button><button type="button" data-min="10">10 min</button>
    </div>
    <div class="time">
      <label class="fld"><span>Minutes</span><input type="number" id="fMin" min="0" max="99" inputmode="numeric"></label>
      <label class="fld"><span>Seconds</span><input type="number" id="fSec" min="0" max="59" inputmode="numeric"></label>
      <label class="fld"><span>Stalling count (s)</span><input type="number" id="fStall" min="5" max="120" inputmode="numeric"></label>
    </div>
    <label class="chk"><input type="checkbox" id="fAuto">Add a penalty automatically when a stalling count reaches zero</label>
    <label class="chk"><input type="checkbox" id="fSound">Sound signals and vibration</label>
    <div class="chips" id="tests">
      <button type="button" data-t="ten">Test 10-second signal</button>
      <button type="button" data-t="end">Test end signal</button>
    </div>
    <p class="hint">Country takes a 3-letter sport code (BRA, UAE, BUL, NZL&hellip;) or a 2-letter ISO code and shows the flag. Changing the match length resets the clock; scores stay as they are.</p>

    <div class="acts">
      <button type="button" id="setupCancel">Cancel</button>
      <button type="submit" class="go">Save setup</button>
    </div>
  </form>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const LS='bjj-scoreboard-v1';
const ISO={BRA:'BR',USA:'US',UAE:'AE',NZL:'NZ',AUS:'AU',GBR:'GB',ENG:'GB',BUL:'BG',GER:'DE',FRA:'FR',ESP:'ES',ITA:'IT',POR:'PT',NED:'NL',BEL:'BE',
SWE:'SE',NOR:'NO',DEN:'DK',FIN:'FI',POL:'PL',RUS:'RU',UKR:'UA',ROU:'RO',GRE:'GR',TUR:'TR',SRB:'RS',CRO:'HR',SLO:'SI',SVK:'SK',CZE:'CZ',HUN:'HU',
AUT:'AT',SUI:'CH',IRL:'IE',JPN:'JP',KOR:'KR',CHN:'CN',KAZ:'KZ',MEX:'MX',ARG:'AR',COL:'CO',CHI:'CL',CAN:'CA',RSA:'ZA',EGY:'EG',JOR:'JO',KSA:'SA',
KUW:'KW',BRN:'BH',QAT:'QA',OMA:'OM',LBN:'LB',ISR:'IL',IND:'IN',PHI:'PH',THA:'TH',SGP:'SG',MAS:'MY',INA:'ID',VIE:'VN',MKD:'MK',MNE:'ME',BIH:'BA',
ALB:'AL',KOS:'XK',LTU:'LT',LAT:'LV',EST:'EE',GEO:'GE',ARM:'AM',AZE:'AZ',MGL:'MN',UZB:'UZ',KGZ:'KG',TJK:'TJ',ANG:'AO',MAR:'MA',TUN:'TN',ALG:'DZ',
NGR:'NG',ISL:'IS',CYP:'CY',LUX:'LU',MLT:'MT',MDA:'MD',BLR:'BY',ECU:'EC',PER:'PE',URU:'UY',VEN:'VE',PAR:'PY',BOL:'BO',CRC:'CR',PAN:'PA',PUR:'PR',
DOM:'DO',CUB:'CU',IRI:'IR',IRQ:'IQ',PAK:'PK',TPE:'TW',HKG:'HK'};

const defaults=()=>({
  fighters:[
    {name:'Fighter one',code:'BRA',team:'Team name',pts:0,adv:0,pen:0},
    {name:'Fighter two',code:'UAE',team:'Team name',pts:0,adv:0,pen:0}],
  match:{id:'A-1',cat:'Men / Black / Adult / -94 kg',round:'Final',dur:300,remain:300000},
  opts:{stall:20,autoPen:true,sound:true}
});

let S=defaults();
try{ const raw=localStorage.getItem(LS); if(raw){ const o=JSON.parse(raw);
  if(o&&o.fighters&&o.fighters.length===2&&o.match&&o.opts){ S=o; } } }catch(e){}

/* runtime only */
let running=false, endAt=0, done=false;
const stall=[{st:'idle',endAt:0,remain:0,timer:0},{st:'idle',endAt:0,remain:0,timer:0}];
const history=[];

function save(){ try{ const c=JSON.parse(JSON.stringify(S)); c.match.remain=remainMs(); localStorage.setItem(LS,JSON.stringify(c)); }catch(e){} }

/* ---------- helpers ---------- */
function flag(code){
  code=(code||'').toUpperCase().trim();
  const iso=code.length===2?code:ISO[code];
  if(!iso||!/^[A-Z]{2}$/.test(iso)) return '';
  return String.fromCodePoint(0x1F1E6+iso.charCodeAt(0)-65,0x1F1E6+iso.charCodeAt(1)-65);
}
function fmt(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function remainMs(){ return running?Math.max(0,endAt-Date.now()):S.match.remain; }
function shortName(i){ const n=(S.fighters[i].name||'').trim(); return n||('Fighter '+(i+1)); }
function buzz(p){ if(S.opts.sound&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
function tap(){ if(navigator.vibrate){ try{navigator.vibrate(8);}catch(e){} } }

let ac=null;
function audio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function beep(freq,dur,when){
  if(!S.opts.sound) return;
  try{ audio(); if(!ac) return; const o=ac.createOscillator(),g=ac.createGain(); o.type='square'; o.frequency.value=freq; g.gain.value=.18;
    o.connect(g); g.connect(ac.destination); const t=ac.currentTime+(when||0); o.start(t); o.stop(t+dur); }catch(e){}
}

/* boxing-style signals */
let noiseBuf=null;
function clack(when){
  try{ audio(); if(!ac) return;
    if(!noiseBuf){ noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.08),ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let n=0;n<d.length;n++) d[n]=Math.random()*2-1; }
    const t=ac.currentTime+when;
    const src=ac.createBufferSource(); src.buffer=noiseBuf;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=1.4;
    const g=ac.createGain(); g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);
    src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(t); src.stop(t+.08);
    const o=ac.createOscillator(), og=ac.createGain(); o.type='square'; o.frequency.value=1150;
    og.gain.setValueAtTime(.35,t); og.gain.exponentialRampToValueAtTime(.001,t+.05);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t+.06);
  }catch(e){}
}
function signalTen(){            /* the 10-second clapper */
  if(!S.opts.sound) return;
  for(let n=0;n<6;n++) clack(n*.14);
  buzz([60,80,60,80,60,80,60,80,60,80,60]);
}
function strike(when){
  try{ audio(); if(!ac) return; const t=ac.currentTime+when;
    [[1,.5],[2,.3],[2.76,.22],[4.07,.12],[5.4,.06]].forEach(p=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=700*p[0];
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p[1],t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.7); });
  }catch(e){}
}
function signalEnd(){            /* ring-side bell, three strikes */
  if(!S.opts.sound) return;
  strike(0); strike(.32); strike(.64);
  buzz([400,120,400,120,900]);
}

let wl=null;
async function wake(on){ try{ if(on){ if(navigator.wakeLock&&!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null;}); } }
  else if(wl){ await wl.release(); wl=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&running) wake(true); });

let toastT=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- build fighter rows ---------- */
const PAD=[['pts',1,'1'],['pts',2,'2'],['pts',3,'3'],['pts',4,'4'],['adv',1,'A'],['pen',1,'P']];
document.querySelectorAll('.fighter').forEach(sec=>{
  const i=sec.dataset.i;
  const plus=PAD.map(b=>`<button class="p" data-act="score" data-i="${i}" data-k="${b[0]}" data-d="${b[1]}" aria-label="Add ${b[2]}">+ ${b[2]}</button>`).join('');
  const minus=PAD.map(b=>`<button class="m" data-act="score" data-i="${i}" data-k="${b[0]}" data-d="${-b[1]}" aria-label="Remove ${b[2]}">&minus; ${b[2]}</button>`).join('');
  sec.innerHTML=`
    <div class="f-main">
      <div class="f-head"><span class="flag"></span><span class="name" data-act="rename" data-i="${i}" role="button" aria-label="Change fighter name"></span><span class="meta"><b class="code"></b><span class="team"></span></span></div>
      <div class="pad">${plus}<button class="stall-btn" data-act="stall" data-i="${i}">Stalling</button>${minus}</div>
    </div>
    <button class="stall" data-act="stall" data-i="${i}" aria-label="Stalling count"><span class="t">00:20</span><span class="l">Stalling</span></button>
    <div class="ap"><div><span>Advantage</span><output class="adv">0</output></div><div><span>Penalty</span><output class="pen">0</output></div></div>
    <div class="score"><output>0</output></div>`;
});
const secs=[...document.querySelectorAll('.fighter')];

const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg>';

/* ---------- render ---------- */
function render(){
  S.fighters.forEach((f,i)=>{
    const el=secs[i];
    el.querySelector('.flag').textContent=flag(f.code);
    el.querySelector('.name').textContent=shortName(i);
    el.querySelector('.code').textContent=(f.code||'').toUpperCase();
    el.querySelector('.team').textContent=f.team||'';
    el.querySelector('.score output').textContent=f.pts;
    el.querySelector('.adv').textContent=f.adv;
    el.querySelector('.pen').textContent=f.pen;
  });
  $('#mid').textContent=S.match.id||'';
  $('#cat').textContent=S.match.cat||'';
  $('#rnd').textContent=S.match.round||'';
  renderClock(); renderStall();
}
function renderClock(){
  const ms=remainMs(), c=$('#clock');
  $('#clockT').textContent=fmt(ms);
  c.classList.toggle('run',running);
  c.classList.toggle('low',running&&ms<=10000);
  c.classList.toggle('done',done);
  $('#playBtn').innerHTML=running?ICON_PAUSE:ICON_PLAY;
}
function renderStall(){
  stall.forEach((s,i)=>{
    const box=secs[i].querySelector('.stall'), btn=secs[i].querySelector('.stall-btn');
    let ms=S.opts.stall*1000;
    if(s.st==='run') ms=Math.max(0,s.endAt-Date.now());
    else if(s.st==='hold') ms=s.remain;
    else if(s.st==='exp') ms=0;
    box.querySelector('.t').textContent=fmt(ms);
    box.classList.toggle('run',s.st==='run'); box.classList.toggle('hold',s.st==='hold'); box.classList.toggle('exp',s.st==='exp');
    btn.classList.toggle('on',s.st==='run'||s.st==='hold');
  });
}

/* ---------- scoring ---------- */
function snapshot(label){ history.push({label,f:S.fighters.map(f=>({pts:f.pts,adv:f.adv,pen:f.pen}))}); if(history.length>200) history.shift(); }
function score(i,k,d){
  const f=S.fighters[i], next=Math.max(0,f[k]+d);
  if(next===f[k]) return;
  const tag=(d>0?'+':'−')+(k==='pts'?Math.abs(d):k==='adv'?'A':'P');
  snapshot(tag+' '+shortName(i));
  f[k]=next;
  if(k==='pts'){ const sc=secs[i].querySelector('.score'); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
  render(); save();
}
function undo(){
  const h=history.pop();
  if(!h){ toast('Nothing to undo'); return; }
  h.f.forEach((v,i)=>Object.assign(S.fighters[i],v));
  toast('Undone: '+h.label); render(); save();
}

/* ---------- match clock ---------- */
function start(){
  if(running) return;
  if(S.match.remain<=0) return;
  done=false; running=true; endAt=Date.now()+S.match.remain; prevMs=S.match.remain<=10000?0:S.match.remain;
  stall.forEach(s=>{ if(s.st==='hold'){ s.st='run'; s.endAt=Date.now()+s.remain; } });
  wake(true); render();
}
function pause(){
  if(!running) return;
  S.match.remain=Math.max(0,endAt-Date.now()); running=false;
  stall.forEach(s=>{ if(s.st==='run'){ s.remain=Math.max(0,s.endAt-Date.now()); s.st='hold'; } });
  wake(false); render(); save();
}
function adjust(sec){
  const cap=(99*60+59)*1000;
  if(running){ endAt=Math.min(Date.now()+cap,endAt+sec*1000); if(endAt<=Date.now()) endAt=Date.now()+1;
    const r=endAt-Date.now(); prevMs=(sec<0&&r<=10000&&prevMs>10000)?prevMs:r; }
  else { S.match.remain=Math.min(cap,Math.max(0,S.match.remain+sec*1000)); if(S.match.remain>0) done=false; }
  renderClock(); save();
}
function timeUp(){
  running=false; S.match.remain=0; done=true;
  stall.forEach((s,i)=>clearStall(i));
  signalEnd();
  wake(false); render(); save();
}

/* ---------- stalling counts ---------- */
function clearStall(i){ const s=stall[i]; clearTimeout(s.timer); s.st='idle'; s.endAt=0; s.remain=0; }
function startStall(i){ const s=stall[i]; clearTimeout(s.timer); s.st='run'; s.endAt=Date.now()+S.opts.stall*1000; }
function toggleStall(i){ if(stall[i].st==='idle') startStall(i); else clearStall(i); renderStall(); }
function stallUp(i){
  const s=stall[i]; s.st='exp';
  if(S.opts.autoPen){ snapshot('+P '+shortName(i)+' (stalling)'); S.fighters[i].pen++; toast('Stalling: penalty to '+shortName(i)); save(); }
  beep(880,.25,0); buzz(250);
  s.timer=setTimeout(()=>{ if(stall[i].st==='exp'){ clearStall(i); renderStall(); } },4000);
  render();
}

/* ---------- tick ---------- */
let lastClock='', lastSt=['',''], prevMs=Infinity;
setInterval(()=>{
  if(running){
    const now=endAt-Date.now();
    if(now<=0){ prevMs=Infinity; timeUp(); return; }
    if(prevMs>10000&&now<=10000) signalTen();
    prevMs=now;
    const t=fmt(remainMs()); if(t!==lastClock){ lastClock=t; renderClock(); if(Math.ceil(remainMs()/1000)%5===0) save(); }
  }
  stall.forEach((s,i)=>{
    if(s.st!=='run') return;
    if(s.endAt-Date.now()<=0){ stallUp(i); return; }
    const t=fmt(s.endAt-Date.now()); if(t!==lastSt[i]){ lastSt[i]=t; renderStall(); }
  });
},100);

/* ---------- result ---------- */
function verdict(){
  const a=S.fighters[0], b=S.fighters[1];
  if(a.pts!==b.pts) return {w:a.pts>b.pts?0:1,how:`By points, ${Math.max(a.pts,b.pts)} to ${Math.min(a.pts,b.pts)}`};
  if(a.adv!==b.adv) return {w:a.adv>b.adv?0:1,how:`Points level at ${a.pts}. By advantages, ${Math.max(a.adv,b.adv)} to ${Math.min(a.adv,b.adv)}`};
  if(a.pen!==b.pen) return {w:a.pen<b.pen?0:1,how:`Points and advantages level. Fewer penalties, ${Math.min(a.pen,b.pen)} to ${Math.max(a.pen,b.pen)}`};
  return {w:-1,how:'Points, advantages and penalties are level'};
}
function showResult(w,how){
  $('#resK').textContent=w<0?'No winner on the board':'Winner';
  $('#resW').textContent=w<0?'Referee decision':shortName(w);
  $('#resHow').textContent=how;
  [0,1].forEach(i=>{ $('#sub'+i).textContent=shortName(i); $('#dq'+i).textContent=shortName(i); });
  $('#result').classList.add('open');
}
function resetMatch(keepSetup){
  pause(); done=false; history.length=0;
  S.fighters.forEach(f=>{f.pts=0;f.adv=0;f.pen=0;});
  S.match.remain=S.match.dur*1000; [0,1].forEach(clearStall);
  render(); save();
}

/* ---------- setup ---------- */
function openSetup(focusId){
  [0,1].forEach(i=>{ $('#n'+i).value=S.fighters[i].name; $('#c'+i).value=S.fighters[i].code; $('#t'+i).value=S.fighters[i].team; });
  $('#fMid').value=S.match.id; $('#fCat').value=S.match.cat; $('#fRnd').value=S.match.round;
  $('#fMin').value=Math.floor(S.match.dur/60); $('#fSec').value=S.match.dur%60;
  $('#fStall').value=S.opts.stall; $('#fAuto').checked=!!S.opts.autoPen; $('#fSound').checked=!!S.opts.sound;
  $('#setup').classList.add('open'); $('#setup').scrollTop=0;
  if(focusId){ const el=$(focusId); setTimeout(()=>{ try{ el.focus(); el.select(); }catch(e){} },60); }
}
function closeSetup(){ $('#setup').classList.remove('open'); if(document.activeElement) document.activeElement.blur(); }
$('#chips').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; $('#fMin').value=b.dataset.min; $('#fSec').value=0; });
$('#tests').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; audio();
  const was=S.opts.sound; S.opts.sound=true; b.dataset.t==='ten'?signalTen():signalEnd(); S.opts.sound=was; });
$('#setupCancel').addEventListener('click',closeSetup);
$('#setupForm').addEventListener('submit',e=>{
  e.preventDefault();
  [0,1].forEach(i=>{ const f=S.fighters[i]; f.name=$('#n'+i).value.trim(); f.code=$('#c'+i).value.trim().toUpperCase(); f.team=$('#t'+i).value.trim(); });
  S.match.id=$('#fMid').value.trim(); S.match.cat=$('#fCat').value.trim(); S.match.round=$('#fRnd').value.trim();
  const num=(v,lo,hi,fb)=>{ v=parseInt(v,10); return isNaN(v)?fb:Math.min(hi,Math.max(lo,v)); };
  let dur=num($('#fMin').value,0,99,5)*60+num($('#fSec').value,0,59,0); if(dur<=0) dur=300;
  if(dur!==S.match.dur){ pause(); S.match.dur=dur; S.match.remain=dur*1000; done=false; }
  S.opts.stall=num($('#fStall').value,5,120,20); S.opts.autoPen=$('#fAuto').checked; S.opts.sound=$('#fSound').checked;
  render(); save(); closeSetup();
});

/* ---------- full screen + landscape lock (where the browser allows it) ---------- */
async function fullScreen(){
  try{
    if(document.fullscreenElement){ await document.exitFullscreen(); return; }
    const el=document.documentElement;
    if(el.requestFullscreen){ await el.requestFullscreen({navigationUI:'hide'}); }
    else { toast('Full screen is not available in this browser'); return; }
    try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
  }catch(e){ toast('Full screen is blocked here'); }
}

/* ---------- actions ---------- */
let resetArm=0;
$('#app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  audio(); tap();
  const i=+b.dataset.i;
  switch(b.dataset.act){
    case 'score': score(i,b.dataset.k,+b.dataset.d); break;
    case 'stall': toggleStall(i); break;
    case 'double': { const any=stall.some(s=>s.st!=='idle'); [0,1].forEach(any&&stall.every(s=>s.st!=='idle')?clearStall:startStall); renderStall(); break; }
    case 'toggle': running?pause():start(); break;
    case 'adj': adjust(+b.dataset.d); break;
    case 'undo': undo(); break;
    case 'switch': { S.fighters.reverse(); const s0=Object.assign({},stall[0]); Object.assign(stall[0],stall[1]); Object.assign(stall[1],s0);
      history.forEach(h=>h.f.reverse()); toast('Sides switched'); render(); save(); break; }
    case 'reset': {
      const rb=$('#resetBtn');
      if(rb.classList.contains('armed')){ clearTimeout(resetArm); rb.classList.remove('armed'); rb.textContent='Reset match'; resetMatch(); toast('Match reset'); }
      else { rb.classList.add('armed'); rb.textContent='Tap again to reset'; resetArm=setTimeout(()=>{ rb.classList.remove('armed'); rb.textContent='Reset match'; },2500); }
      break; }
    case 'end': { pause(); const v=verdict(); showResult(v.w,v.how); break; }
    case 'sub': showResult(i,'By submission'); break;
    case 'dq': showResult(1-i,shortName(i)+' disqualified'); break;
    case 'resClose': $('#result').classList.remove('open'); break;
    case 'newMatch': $('#result').classList.remove('open'); resetMatch(); openSetup(); break;
    case 'setup': openSetup(); break;
    case 'rename': openSetup('#n'+i); break;
    case 'full': fullScreen(); break;
  }
});
document.addEventListener('keydown',e=>{
  if($('#setup').classList.contains('open')) return;
  if(e.code==='Space'){ e.preventDefault(); running?pause():start(); }
});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ---------- always-landscape stage ---------- */
function fit(){
  const w=window.innerWidth,h=window.innerHeight,app=$('#app');
  if(h>w){ app.style.width=h+'px'; app.style.height=w+'px'; app.style.left=w+'px'; app.style.transform='rotate(90deg)'; }
  else   { app.style.width=w+'px'; app.style.height=h+'px'; app.style.left='0px'; app.style.transform='none'; }
}
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,150));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{ if(!$('#setup').classList.contains('open')) fit(); });
window.addEventListener('pagehide',save);

fit(); render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
</body>
